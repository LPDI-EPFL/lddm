[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lddm"]

[project]
name = "lddm"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # Shared dependencies for CPU and CUDA installations
    "rdkit==2023.9.6",
    "biopython==1.83",
    "prody>=2.4.1",
    "prolif==2.0.3",
    "posebusters==0.3.1",
    "useful-rdkit-utils==0.65",
    "fcd==1.2.2",
    "biotite>=1.5.0",
    # RDKit 2023.9.6 wheels do not support NumPy 2.
    "numpy==1.26.4",
    "scipy==1.13.0",
    "pandas==2.2.3",
    "pot==0.9.4",
    "einops>=0.8.0",
    "tqdm",
    "setuptools",
]

[project.optional-dependencies]
cpu = [
    "torch==2.6.0+cpu",
    "lightning>=2.3.3",
    "torch-geometric==2.7.0",
    "torch-scatter==2.1.2+pt26cpu",
]
cuda = [
    "torch==2.6.0+cu124",
    "lightning>=2.3.3",
    "torch-geometric==2.7.0",
    "torch-scatter==2.1.2+pt26cu124",
]
dev = [
    # Logging
    "wandb==0.16.6",

    # Notebooks & plotting
    "ipython",
    "ipykernel",
    "notebook",
    "matplotlib==3.8.4",
]

# ---------------------------------------------------------------------------
# CPU and CUDA extras use different PyTorch and PyG wheel indexes.
# Both extras are locked, but only one can be installed at a time.
# ---------------------------------------------------------------------------
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.6.0+cpu.html"
explicit = true
format = "flat"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pyg-cu124"
url = "https://data.pyg.org/whl/torch-2.6.0+cu124.html"
explicit = true
format = "flat"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]
torch-scatter = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu124", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
