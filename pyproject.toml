[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lddm"]

[project]
name = "lddm"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # PyTorch ecosystem — wheels served from the pytorch cu124 index (see below)
    "torch==2.6.0+cu124",
    "lightning>=2.3.3",

    # PyG — torch-geometric is pure Python (PyPI); torch-scatter needs compiled
    # CUDA wheels served from the PyG index (see below)
    "torch-geometric>=2.5.1",
    "torch-scatter>=2.1.2",

    # Cheminformatics / structural biology
    "rdkit==2023.9.6",
    "biopython==1.83",
    "prody>=2.4.1",
    "prolif==2.0.3",
    "posebusters==0.3.1",
    "useful-rdkit-utils==0.65",
    "fcd==1.2.2",
    "biotite>=1.5.0",

    # Scientific computing
    "numpy>=1.23.5",
    "scipy==1.13.0",
    "pandas==2.2.3",
    "pot==0.9.4",
    "einops>=0.8.0",

    # Misc
    "tqdm",

    # Runtime requirement of prolif (imports pkg_resources), not installed by
    # default on Python 3.11
    "setuptools",
]

[project.optional-dependencies]
dev = [
    # Logging
    "wandb==0.16.6",

    # Notebooks & plotting
    "ipython",
    "ipykernel",
    "notebook",
    "matplotlib==3.8.4",
]

# ---------------------------------------------------------------------------
# Index configuration
# torch* and torch-scatter have CUDA-specific wheels that are not on PyPI;
# `explicit = true` means uv will only look at that index for the packages
# listed under [tool.uv.sources], keeping the rest of the resolution on PyPI.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pyg-cu124"
url = "https://data.pyg.org/whl/torch-2.6.0+cu124.html"
explicit = true
format = "flat"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
torch-scatter = [{ index = "pyg-cu124" }]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
